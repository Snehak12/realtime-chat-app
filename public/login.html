<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <p>
        Don't have an account?
        <a href="/register.html">Register</a>
    </p>

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            try {

                const response = await fetch("/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data =
                    await response.json();

                if (!response.ok) {

                    message.textContent =
                        data.message;

                    return;
                }

                localStorage.setItem(
                    "token",
                    data.token
                );

                message.textContent =
                    "Login successful!";

                setTimeout(() => {
                    window.location.href =
                        "/index.html";
                }, 500);

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Login failed.";
            }
        });

    </script>

</body>
</html>
