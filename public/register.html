<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>

<body>

    <h1>Register</h1>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="/login.html">Login</a>
    </p>

    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        registerForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            try {

                const response = await fetch("/register", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                });

                const data =
                    await response.json();

                if (!response.ok) {
                    message.textContent =
                        data.message;

                    return;
                }

                message.textContent =
                    "Registration successful!";

                setTimeout(() => {
                    window.location.href =
                        "/login.html";
                }, 1000);

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Registration failed.";
            }
        });

    </script>

</body>
</html>
